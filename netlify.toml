[functions]
  # Stated explicitly rather than relying on the default, so this doesn't
  # depend on whatever the site's UI settings say.
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # The chat function reads the knowledge base off disk at runtime.
  included_files = ["kb-public.md"]

# The publish directory is the repo root, so every file here is served as a
# static asset unless blocked. These are source, not site.
[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/CHAT.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/COPY.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/DEPLOYMENT_GUIDE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
